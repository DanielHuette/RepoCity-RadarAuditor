# Prüfkatalog RadarAuditor. Einzige Quelle für Prüfungen, Gewichte, Schwellwerte und Kundenwortlaut.
# Gewichte der Bereiche summieren auf 100. Prüfungen mit requires_paid oder requires_access werden
# ohne Bezahldienst bzw. ohne Kundenzugang nicht gewertet; ihr Gewicht verteilt sich im Bereich.
# source: crawler | pagespeed | places | serp | directories | assistants | paid | access | manual
# measured_by: woher der Messwert kommt, wo die Quelle nicht schon aus source folgt.
# paid = DataForSEO, in den Einstellungen (Quelle dataforseo) standardmäßig an, mit Monatslimit;
# ist das Limit erreicht, stehen diese Prüfungen auf „nicht messbar“ mit „Monatslimit erreicht“.

areas:
  - id: a
    name: 'Technik der Website'
    weight: 9
    checks:
      - id: a1
        name: 'Verschlüsselte Seite unter einer einzigen Adresse'
        why: 'Ohne das Schloss im Browser warnt Google deine Besucher, und mehrere Adressen teilen deine Sichtbarkeit auf.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Ist deine Seite verschlüsselt und unter genau einer Adresse erreichbar?
        customer_impact: Ohne Schloss im Browser warnt Google Besucher; mehrere Adressen teilen deine Sichtbarkeit auf.
      - id: a2
        name: 'Seite lädt am Handy in unter 2,5 Sekunden'
        why: 'Jede Sekunde Warten kostet Anrufe, weil Besucher vorher wegklicken.'
        source: pagespeed
        requires_paid: false
        requires_access: false
        thresholds: {lcp_ms_max: 2500, cls_max: 0.1, inp_ms_max: 200, mobile_score_min: 70}
        customer_question: Lädt deine Seite auf dem Handy in unter 2,5 Sekunden?
        customer_impact: Jede Sekunde mehr kostet Anrufe, weil Besucher abspringen; Google stuft langsame Seiten zurück.
      - id: a3
        name: 'Seite am Handy ohne Zoomen bedienbar'
        why: 'Die meisten Kunden suchen am Handy und geben auf, wenn sie zoomen müssen.'
        source: pagespeed
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Ist deine Seite auf dem Handy bedienbar, ohne zu zoomen?
        customer_impact: Die meisten Kunden suchen am Handy und geben auf, wenn sie zoomen müssen.
      - id: a4
        name: 'Google findet alle deine Seiten'
        why: 'Eine Seite, die Google nicht kennt, bringt dir keinen einzigen Kunden.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Findet Google alle deine Seiten?
        customer_impact: Seiten, die Google nicht kennt, bringen keine Kunden.
      - id: a5
        name: 'Keine toten Links'
        why: 'Ein Link ins Leere wirkt ungepflegt, auf Besucher wie auf Google.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {max_broken: 0, max_redirect_hops: 2}
        customer_question: Führen alle Links auf deiner Seite zum Ziel?
        customer_impact: Tote Links wirken ungepflegt, auf Besucher und auf Google.
      - id: a6
        name: 'Jede Seite gibt es für Google nur einmal'
        why: 'Gibt es eine Seite in mehreren Fassungen, machen sie sich bei Google gegenseitig Konkurrenz.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Weiß Google, welche Fassung einer Seite die richtige ist?
        customer_impact: Ohne diese Angabe konkurrieren Kopien deiner Seite miteinander.
      - id: a7
        name: 'Bilder klein und beschrieben'
        why: 'Große Bilder bremsen die Seite, und unbeschriebene Bilder findet die Bildersuche nicht.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {max_image_kb: 300, max_missing_alt: 0}
        customer_question: Sind deine Bilder klein genug und beschrieben?
        customer_impact: Große Bilder bremsen die Seite; fehlende Beschreibungen kosten Sichtbarkeit in der Bildersuche.
      - id: a8
        name: 'Text auch ohne Zusatzprogramme lesbar'
        why: 'Was erst ein Programm im Browser auf die Seite holt, übersehen Google und KI-Assistenten oft.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Kann Google deinen Text lesen, ohne die Seite auszuführen?
        customer_impact: Was nur per Skript erscheint, übersehen Suchmaschinen und KI-Assistenten oft.
      - id: a9
        name: 'Seite als deutsch gekennzeichnet'
        why: 'Sonst ordnet Google deine Seite womöglich dem falschen Land zu.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Ist deine Seite als deutsch gekennzeichnet?
        customer_impact: Google ordnet die Seite sonst dem falschen Sprachraum zu.
      - id: a10
        name: 'Keine Sicherheitswarnungen im Browser'
        why: 'Eine Warnung reicht, damit ein Kunde die Seite sofort wieder schließt.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Ist deine Seite sauber abgesichert?
        customer_impact: Browser-Warnungen schrecken Kunden ab.

  - id: b
    name: 'Aufbau der Seiten'
    weight: 10
    checks:
      - id: b1
        name: 'Jede Seite nennt oben Leistung und Ort'
        why: 'Google liest die Hauptüberschrift als Thema der Seite, und der Kunde weiß sofort, dass er richtig ist.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sagt die Überschrift jeder Seite, was du wo anbietest?
        customer_impact: Google liest die Hauptüberschrift als Thema der Seite.
      - id: b2
        name: 'Titel bei Google nennt, wonach Kunden suchen'
        why: 'Der Titel ist die blaue Zeile im Suchergebnis und entscheidet, ob jemand klickt.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {min_chars: 30, max_chars: 60}
        customer_question: Steht in deinem Seitentitel, wonach Kunden suchen?
        customer_impact: Der Titel ist die blaue Zeile bei Google; er entscheidet, ob geklickt wird.
      - id: b3
        name: 'Eigener Vorschautext bei Google je Seite'
        why: 'Fehlt er, nimmt Google irgendeinen Satz von der Seite, meist einen unpassenden.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {min_chars: 70, max_chars: 155}
        customer_question: Hat jede Seite einen eigenen Vorschautext für Google?
        customer_impact: Ohne Vorschautext schreibt Google selbst etwas, meist Unpassendes.
      - id: b4
        name: 'Überschriften sauber gegliedert'
        why: 'Eine klare Gliederung hilft Google und KI-Assistenten zu verstehen, was du anbietest.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind deine Überschriften sauber gegliedert?
        customer_impact: Eine klare Gliederung hilft Google und KI-Assistenten, Inhalte zuzuordnen.
      - id: b5
        name: 'Jede Leistung in höchstens drei Klicks erreichbar'
        why: 'Was tief versteckt ist, finden weder Kunden noch Google.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {max_depth: 3}
        customer_question: Sind deine Leistungen von der Startseite aus schnell erreichbar?
        customer_impact: Versteckte Seiten werden seltener gefunden, von Kunden und von Google.
      - id: b6
        name: 'Verständliche Seitenadressen'
        why: '„/dachsanierung-muenster“ wird öfter geklickt als „/seite-17“.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sagt die Internetadresse einer Seite, worum es geht?
        customer_impact: '"/dachsanierung-muenster" wird öfter geklickt als "/seite-17".'
      - id: b7
        name: 'Geteilte Links zeigen Bild und Titel'
        why: 'Ein Link ohne Bild wird in WhatsApp und Co. kaum angeklickt.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sieht ein geteilter Link zu deiner Seite gut aus?
        customer_impact: Ein Link ohne Bild und Titel wird in WhatsApp seltener angeklickt.
      - id: b8
        name: 'Kein doppelter Text auf mehreren Seiten'
        why: 'Kopierte Seiten verdrängen sich bei Google gegenseitig.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {max_similarity: 0.8}
        customer_question: Hat jede Seite eigenen Text?
        customer_impact: Kopierte Seiten verdrängen sich gegenseitig bei Google.
      - id: b9
        name: 'Seite zeigt, wo man gerade ist'
        why: 'Google zeigt diesen Pfad im Suchergebnis an, das bringt zusätzliche Klicks.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Zeigt deine Seite, wo man sich gerade befindet?
        customer_impact: Google zeigt diesen Pfad im Suchergebnis an; das bringt Klicks.
      - id: b10
        name: 'Hilfreiche Fehlerseite'
        why: 'Wer auf einer toten Seite landet, findet zurück, statt zu gehen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Landet ein Besucher auf einer toten Seite, findet er zurück?
        customer_impact: Sonst ist der Besucher weg.

  - id: c
    name: 'Inhalte und Leistungsseiten'
    weight: 12
    checks:
      - id: c1
        name: 'Eigene Seite je Leistung'
        why: 'Wer „Dachsanierung“ sucht, bekommt von Google die Seite, die nur davon handelt, nicht deine Sammelseite.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Hat jede deiner Leistungen eine eigene Seite?
        customer_impact: Google zeigt für "Dachsanierung" die Seite, die nur davon handelt, nicht die Sammelseite.
      - id: c2
        name: 'Seite für jede gesuchte Leistung in deinem Ort'
        why: 'Für jede gesuchte Leistung ohne eigene Seite landet der Kunde beim Wettbewerber.'
        source: paid
        requires_paid: true
        requires_access: false
        thresholds: {min_volume: 10}
        measured_by: DataForSEO Google-Ads-Suchvolumen (Deutschland) je Suchbegriff plus Ort
        customer_question: Gibt es für jede gesuchte Leistung in deinem Ort eine Seite?
        customer_impact: Für jede fehlende Seite gehen Suchende zum Wettbewerber.
      - id: c3
        name: 'Leistungsseiten mit Ablauf, Dauer und Preisrahmen'
        why: 'Kunden wollen wissen, was sie erwartet, und Google zeigt dünne Seiten weit hinten.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {min_words: 300}
        customer_question: Beantwortet jede Leistungsseite Ablauf, Dauer und Preisrahmen?
        customer_impact: Dünne Seiten ranken nicht und überzeugen nicht.
      - id: c4
        name: 'Die Suchwörter der Kunden stehen im Text'
        why: 'Google findet nur, was auch dasteht.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {max_density: 0.02}
        customer_question: Stehen die Wörter, nach denen Kunden suchen, im Text?
        customer_impact: Google findet nur, was auch dasteht.
      - id: c5
        name: 'Häufige Kundenfragen beantwortet'
        why: 'Genau diese Fragen stellen Kunden auch KI-Assistenten, und genannt wird, wer sie beantwortet.'
        source: serp
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Beantwortet deine Seite die Fragen, die Google unter "Nutzer fragen auch" zeigt?
        customer_impact: Diese Fragen stellen Kunden auch KI-Assistenten; wer sie beantwortet, wird genannt.
      - id: c6
        name: 'Stadtteile und Nachbarorte im Text'
        why: 'Nur so findet dich auch das Umland.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Nennt dein Text Stadtteile und Nachbarorte?
        customer_impact: Nur der Stadtname im Titel reicht nicht, um für das Umland gefunden zu werden.
      - id: c7
        name: 'Nichts Veraltetes auf der Seite'
        why: 'Alte Jahreszahlen oder Preise wirken, als gäbe es den Betrieb nicht mehr.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Steht auf deiner Seite nichts Veraltetes?
        customer_impact: Alte Jahreszahlen und Preise wirken wie ein geschlossener Laden.
      - id: c8
        name: 'Über-uns mit Namen, Fotos und Qualifikation'
        why: 'Kunden kaufen bei Menschen, und Google bewertet sichtbare Erfahrung höher.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Zeigt deine Seite, wer dahinter steht?
        customer_impact: Google bewertet Erfahrung und Vertrauenswürdigkeit; Kunden auch.
      - id: c9
        name: 'Kontakt mit einem Tippen'
        why: 'Klickbares Telefon, Formular und Karte; jeder Umweg kostet Anfragen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Kann ein Kunde dich mit einem Tipp anrufen?
        customer_impact: Jeder Umweg kostet Anfragen.
      - id: c10
        name: 'Ratgeber zu Themen aus deiner Region'
        why: 'Regionale Themen holen Besucher, um die sich sonst niemand kümmert.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {min_posts: 5}
        customer_question: Hat deine Seite Beiträge zu Themen aus deiner Region?
        customer_impact: Regionale Themen bringen Besucher, die sonst niemand bedient.
      - id: c11
        name: 'Keine fast leeren Seiten'
        why: 'Leere Seiten ziehen die Bewertung deiner ganzen Website nach unten.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {min_words: 100}
        customer_question: Gibt es Seiten mit fast keinem Inhalt?
        customer_impact: Sie ziehen die Bewertung der ganzen Seite nach unten.
      - id: c12
        name: 'Suchbegriffe, bei denen der Wettbewerber gefunden wird und du nicht'
        why: 'Das ist die Liste der Aufträge, die heute bei anderen landen.'
        source: paid
        requires_paid: true
        requires_access: false
        thresholds: {}
        measured_by: DataForSEO Labs Domain-Schnittmenge (Google Deutschland) je Wettbewerber-Domain
        customer_question: Für welche Begriffe wird dein Wettbewerber gefunden und du nicht?
        customer_impact: Das ist die Liste der Aufträge, die heute woanders landen.

  - id: d
    name: 'Firmendaten auf der Website'
    weight: 6
    checks:
      - id: d1
        name: 'Name, Adresse, Telefon auf jeder Seite als Text'
        why: 'Google gleicht sie mit deinem Profil ab, und als Bild kann Google sie nicht lesen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Stehen deine Firmendaten auf jeder Seite als Text?
        customer_impact: Google gleicht sie mit deinem Profil ab; als Bild sind sie unsichtbar.
      - id: d2
        name: 'Adresse und Telefon überall gleich geschrieben'
        why: 'Schon kleine Abweichungen lassen Google zweifeln, ob es dieselbe Firma ist.'
        source: places
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind Adresse und Telefon überall gleich geschrieben?
        customer_impact: Abweichungen lassen Google zweifeln, ob es dieselbe Firma ist.
      - id: d3
        name: 'Öffnungszeiten auf Website und Google gleich'
        why: 'Falsche Zeiten kosten Besuche und bringen schlechte Bewertungen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Stimmen deine Öffnungszeiten auf Website und Google überein?
        customer_impact: Falsche Zeiten kosten Besuche und bringen schlechte Bewertungen.
      - id: d4
        name: 'Eigene Seite je Standort'
        why: 'Sonst wird nur einer deiner Standorte gefunden.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Hat jeder Standort eine eigene Seite?
        customer_impact: Sonst wird nur ein Standort gefunden.
      - id: d5
        name: 'Website verlinkt dein Google-Profil'
        why: 'Das verbindet beides für Google zu einem Betrieb.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Verlinkt deine Seite auf dein Google-Profil?
        customer_impact: Das verbindet Website und Profil für Google.
      - id: d6
        name: 'Telefon und E-Mail antippbar'
        why: 'Am Handy tippt niemand eine Nummer ab.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind Telefonnummer und E-Mail antippbar?
        customer_impact: Am Handy wählt sonst niemand eine Nummer ab.

  - id: e
    name: 'Unsichtbare Angaben für Google und KI'
    weight: 7
    checks:
      - id: e1
        name: 'Firmendaten maschinenlesbar auf der Startseite'
        why: 'Mit diesen unsichtbaren Angaben kennen Google und KI-Assistenten Adresse, Zeiten und Leistungen sicher, statt zu raten.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Erklärt deine Seite Google und KI-Assistenten in deren Sprache, was du bist?
        customer_impact: Ohne diese unsichtbaren Angaben raten Maschinen; mit ihnen wissen sie Adresse, Zeiten, Leistungen.
      - id: e2
        name: 'Logo für Google hinterlegt'
        why: 'Google zeigt es dann neben deinem Namen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Ist dein Logo für Google hinterlegt?
        customer_impact: Google zeigt es dann neben deinem Namen.
      - id: e3
        name: 'Leistungen und Einsatzgebiet maschinenlesbar'
        why: 'KI-Assistenten empfehlen Betriebe, deren Leistungen sie sicher kennen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind deine Leistungen maschinenlesbar hinterlegt?
        customer_impact: KI-Assistenten nennen Betriebe, deren Leistungen sie sicher kennen.
      - id: e4
        name: 'Häufige Fragen für Google markiert'
        why: 'Google kann sie dann direkt im Suchergebnis zeigen.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind deine häufigen Fragen für Google markiert?
        customer_impact: Google kann sie direkt im Suchergebnis zeigen.
      - id: e5
        name: 'Seitenpfad maschinenlesbar'
        why: 'Damit zeigt Google den Pfad im Suchergebnis an.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Ist der Seitenpfad maschinenlesbar?
        customer_impact: Ergibt den Pfad im Suchergebnis.
      - id: e6
        name: 'Sterne nur bei echten Bewertungen'
        why: 'Falsch markierte Sterne bestraft Google.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Werden Sterne nur dort markiert, wo echte Bewertungen stehen?
        customer_impact: Falsch markierte Sterne bestraft Google.
      - id: e7
        name: 'Unsichtbare Angaben fehlerfrei'
        why: 'Fehlerhafte Angaben ignoriert Google komplett.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind die unsichtbaren Angaben fehlerfrei?
        customer_impact: Fehlerhafte Angaben ignoriert Google komplett.
      - id: e8
        name: 'Website verweist auf alle deine Profile'
        why: 'So erkennen Maschinen, dass alle Einträge zu einem Betrieb gehören.'
        source: crawler
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Verweist deine Seite auf alle deine Profile?
        customer_impact: So erkennen Maschinen, dass alle Einträge zu einer Firma gehören.

  - id: f
    name: 'Google-Unternehmensprofil'
    weight: 14
    checks:
      - id: f1
        name: 'Profil gehört dir und ist bestätigt'
        why: 'Ohne Profil keine Karte, und ohne Besitz kann jeder deine Angaben ändern.'
        source: places
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Hast du dein Google-Profil in der Hand?
        customer_impact: Ohne Profil keine Karte; ohne Besitz kann jeder deine Daten ändern.
      - id: f2
        name: 'Hauptkategorie wie bei den stärksten Wettbewerbern'
        why: 'Die Kategorie entscheidet, bei welchen Suchen du auf der Karte auftauchst.'
        source: places
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Steht dein Profil in derselben Schublade wie deine Wettbewerber?
        customer_impact: Die Kategorie entscheidet, bei welchen Suchen du auf der Karte erscheinst.
      - id: f3
        name: 'Drei bis neun Nebenkategorien'
        why: 'Jede fehlende Kategorie ist eine Suche, bei der du nicht erscheinst.'
        source: places
        requires_paid: false
        requires_access: false
        thresholds: {min: 3, max: 9}
        customer_question: Deckt dein Profil alle deine Leistungen als Kategorien ab?
        customer_impact: Jede fehlende Kategorie ist eine Suche, bei der du nicht erscheinst.
      - id: f4
        name: 'Beschreibung nutzt den Platz, Leistung und Ort vorn'
        why: 'Die ersten Zeilen sieht jeder Interessent; sie müssen sagen, was du wo machst.'
        source: places
        measured_by: Google Maps im Browser; nur dort sichtbar, ohne Wert, wenn Maps sperrt
        requires_paid: false
        requires_access: false
        thresholds: {min_chars: 600, max_chars: 750}
        customer_question: Nutzt deine Profilbeschreibung den Platz?
        customer_impact: Die ersten 250 Zeichen sieht jeder; sie müssen Leistung und Ort nennen.
      - id: f5
        name: 'Leistungen eingetragen'
        why: 'Google zeigt Profile mit passenden Leistungen bevorzugt.'
        source: places
        measured_by: Google Maps im Browser; nur dort sichtbar, ohne Wert, wenn Maps sperrt
        requires_paid: false
        requires_access: false
        thresholds: {max: 50}
        customer_question: Sind deine Leistungen im Profil eingetragen?
        customer_impact: Google zeigt Profile mit passenden Leistungen bevorzugt.
      - id: f6
        name: 'Produkte oder Angebote eingetragen'
        why: 'Angebote im Profil bringen Anfragen, ohne dass jemand deine Website öffnet.'
        source: places
        measured_by: Google Maps im Browser; nur dort sichtbar, ohne Wert, wenn Maps sperrt
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Zeigt dein Profil Produkte oder Angebote?
        customer_impact: Produkte bringen Anfragen direkt aus dem Profil.
      - id: f7
        name: 'Öffnungszeiten vollständig, auch an Feiertagen'
        why: 'Wer „geschlossen“ liest oder vor verschlossener Tür steht, ruft beim Nächsten an.'
        source: places
        requires_paid: false
        requires_access: false
        thresholds: {}
        customer_question: Sind deine Öffnungszeiten vollständig?
        customer_impact: '"Geschlossen" an einem Werktag ohne Angabe kostet Kunden.'
      - id: f8
        name: 'Mindestens zehn Fotos, Logo und Titelbild'
        why: 'Profile mit Fotos bekommen mehr Anrufe und Routenanfragen.'
        source: places
        requires_paid: false
        requires_access: false
        thresholds: {min_photos: 10}
        customer_question: Zeigt dein Profil aktuelle Fotos?
        customer_impact: Profile mit Fotos bekommen mehr Anrufe und Routenanfragen.
